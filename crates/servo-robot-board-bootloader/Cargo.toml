[package]
    name = "servo-robot-board-bootloader"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.1"
stm32f4 = { version = "0.16.0", features = ["stm32f411"] }
panic-halt = "1.0.0"

[[bin]]
name = "bootloader"
path = "src/main.rs"
test = false
bench = false
